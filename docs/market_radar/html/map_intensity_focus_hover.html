			function attachPersistentHover(graphDiv) {
				if (!graphDiv) { return; }
				const focusCodes = ["AR", "BR", "CL", "CO", "PE", "UY", "MX"];
				let initialized = false;
				const computeHoverPoints = function() {
					const customSeries = ((graphDiv.data && graphDiv.data[0] && graphDiv.data[0].customdata) || [])
					    .map(row => (row && row[0]) ? row[0].toString().toUpperCase() : '');
					const pts = [];
					focusCodes.forEach(code => {
						const idx = customSeries.indexOf(code);
						if (idx >= 0) { pts.push({curveNumber: 0, pointNumber: idx}); }
					});
					return pts;
				};
				const showAllHover = function(delay) {
					const pts = computeHoverPoints();
					if (!pts.length) { return; }
					setTimeout(function() { Plotly.Fx.hover(graphDiv, pts, 'geo'); }, delay || 0);
				};
				const init = function() {
					if (initialized) { return; }
					initialized = true;
					showAllHover(0);
					graphDiv.on('plotly_hover', function() { showAllHover(0); });
					graphDiv.on('plotly_unhover', function() { showAllHover(0); });
					graphDiv.on('plotly_relayout', function() { showAllHover(120); });
					graphDiv.on('plotly_restyle', function() { showAllHover(120); });
					graphDiv.on('plotly_afterplot', function() { showAllHover(0); });
					window.addEventListener('resize', function() { showAllHover(150); });
					setInterval(function() { showAllHover(0); }, 2000);
					document.addEventListener('visibilitychange', function() { if (!document.hidden) { showAllHover(0); } });
				};
				if (graphDiv.data && graphDiv.data.length) {
					init();
				} else {
					let pendingInit = false;
					const afterplotHandler = function() {
						if (pendingInit) { return; }
						pendingInit = true;
						setTimeout(function() { init(); }, 0);
					};
					graphDiv.on('plotly_afterplot', afterplotHandler);
				}
			}
			var graphDiv = document.getElementById('plotly-f992b2d1138f40a78c154d4ca1c5f798');
