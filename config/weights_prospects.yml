signals:
  # Peso "base" por tipo de señal, para medir calidad del mix
  base_weights:
    sbti: 1.0
    b_corp: 0.5
    ungc: 0.2

  # Multiplicadores para priorizar en el ranking final
  # Ej: score_final = base_score * boost_factor * volume_factor
  boost_factors:
    sbti: 1.4
    b_corp: 1.1
    ungc: 1.0

prospecting_rules:
  # Umbrales mínimos para que una empresa sea considerada prospecto potencial
  min_country_weight: 0.6   # descarta países claramente fuera de foco
  min_industry_weight: 0.6  # descarta industrias claramente fuera de foco

  volume:
    per_event: 0.03         # +3% por evento
    max_events: 20          # hasta +60% máximo (20 * 0.03)

prospecting_weights:

  nativas:
    countries:
      tier1:
        weight: 1.0
        countries:
          - AR
